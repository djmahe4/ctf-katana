name: firewall
version: "1.0.0"
description: |
  Network Security & AI Containment Armor (Kavach).
  
  Provides robust network firewall auditing (iptables, nftables, ufw)
  and AI agent containment using the Kavach implementation (PhantomWorkspace, PII Sanitizer).
  
author: Purple Engine Team
license: MIT

category: network-security
tags:
  - firewall
  - kavach
  - iptables
  - security-audit
  - containment

entrypoint: run.py

inputs:
  mode:
    type: string
    required: false
    default: audit
    enum: [audit, containment, bypass_test]
    description: Operation mode (Audit existing rules, Contain AI subagent, or Test bypass techniques)
  
  profile:
    type: string
    required: false
    default: standard
    enum: [strict, standard, permissive]
    description: Kavach security profile for containment mode
  
  target_config:
    type: string
    required: false
    description: Path to firewall configuration file (for audit mode)

outputs:
  audit_report:
    type: string
  containment_status:
    type: string
  vulnerabilities:
    type: array

kavach_policy: standard
