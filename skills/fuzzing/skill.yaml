name: "fuzzing"
description: "Advanced Fuzzing & Target Designer for modular web, binary, protocol, and cloud targets."
version: "2.0.0"
author: "Antigravity-C4"

# Modular Handler Configuration
handlers:
  - name: "WebHandler"
    path: "handlers/web_handler.py"
    modes: ["web", "directory", "parameter"]
  - name: "BinaryHandler"
    path: "handlers/binary_handler.py"
    modes: ["binary", "elf", "pe"]
  - name: "ProtocolHandler"
    path: "handlers/protocol_handler.py"
    modes: ["protocol", "network", "scapy"]
  - name: "CloudHandler"
    path: "handlers/cloud_handler.py"
    modes: ["cloud", "serverless", "emulation"]

# LLM-Driven Designer Engine
engines:
  - name: "FuzzDesigner"
    path: "engines/fuzz_designer.py"
    model: "groq/llama-3.3-70b-versatile"
  - name: "FfufAI"
    path: "ffufai/engine.py"
    model: "groq/llama-3.3-70b-versatile"

# Actions Supported
actions:
  - "fuzz"
  - "analyze"
  - "harness"
  - "think"
  - "mutate"

# Requirements
dependencies:
  - "requests"
  - "scapy"
  - "argparse"
