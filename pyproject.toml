[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-katana"
version = "0.1.0"
description = "Agentic AI CTF-solving system powered by an MCP server and Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.0.0",
    "ollama>=0.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
katana-server = "server.mcp_server:main"

[tool.setuptools.packages.find]
include = ["server*", "agents*", "tools*", "context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

