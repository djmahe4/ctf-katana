[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-katana"
version = "0.1.0"
description = "Agentic AI CTF-solving system powered by an MCP server and Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.23.0",      # >=1.23.0: fixes DNS-rebinding + DoS vulnerabilities
    "httpx>=0.25.0",    # HTTP client used by agentic_dispatcher and fuzzing web_handler
    "ollama>=0.4.0",
    "pyyaml>=6.0",
    # Purple Engine - Phase 1: CTFd Integration
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

# Purple Engine - Future phase dependencies
phase2 = [
    # Kavach AI Firewall (Phase 2)
]

phase3 = [
    # Research & RAG (Phase 3)
    # "chromadb>=0.4.0",
    # "lancedb>=0.5.0",
    # "yt-dlp>=2023.0.0",
]

phase4 = [
    # Multi-domain support (Phase 4)
    # "web3>=6.0.0",
    # "pwntools>=4.11.0",
    # "frida>=16.0.0",
]

all = [
    "ctf-katana[dev,phase2,phase3,phase4]",
]

[project.scripts]
katana-server = "server.mcp_server:main"
purple-engine = "cli.main:main"

[tool.setuptools.packages.find]
include = ["server*", "agents*", "tools*", "context*", "skills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

